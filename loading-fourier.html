<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fourier Loading</title>
    <style>
        body {
            margin: 0;
            background: #2d4566;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Space Mono', monospace;
        }

        #canvas {
            max-width: 90vw;
            max-height: 90vh;
        }

        .loading-text {
            position: absolute;
            bottom: 10%;
            color: #00ff88;
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>
    <div class="loading-text">Loading</div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = 800;
        canvas.height = 600;

        let time = 0;
        const wave = [];

        // Fourier series coefficients
        const fourierSeries = [];
        for (let n = 1; n <= 7; n++) {
            const odd = 2 * n - 1;
            fourierSeries.push({
                freq: odd,
                amp: 100 / odd,
                phase: 0
            });
        }

        function drawCircle(x, y, radius) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.stroke();
        }

        function drawLine(x1, y1, x2, y2, color = 'rgba(255, 255, 255, 0.5)') {
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }

        function animate() {
            ctx.fillStyle = '#2d4566';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let x = 200;
            let y = canvas.height / 2;

            // Draw epicycles
            for (let i = 0; i < fourierSeries.length; i++) {
                const prevX = x;
                const prevY = y;

                const n = fourierSeries[i].freq;
                const radius = fourierSeries[i].amp;
                const angle = n * time + fourierSeries[i].phase;

                x += radius * Math.cos(angle);
                y += radius * Math.sin(angle);

                // Draw circle
                drawCircle(prevX, prevY, radius);

                // Draw radius line
                drawLine(prevX, prevY, x, y);

                // Draw dot
                ctx.fillStyle = `hsl(${i * 40}, 100%, 50%)`;
                ctx.beginPath();
                ctx.arc(x, y, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            // Add point to wave
            wave.unshift(y);

            // Draw connecting line to wave
            drawLine(x, y, 400, y, '#00ff88');

            // Draw wave
            ctx.beginPath();
            ctx.strokeStyle = '#00ff88';
            ctx.lineWidth = 2;

            for (let i = 0; i < wave.length; i++) {
                ctx.lineTo(400 + i * 2, wave[i]);
            }
            ctx.stroke();

            // Limit wave length
            if (wave.length > 200) {
                wave.pop();
            }

            time += 0.05;

            requestAnimationFrame(animate);
        }

        animate();

        // Auto-redirect after 2 seconds
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 2000);
    </script>
</body>

</html>
