<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Giacomo Bertapelle</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <!-- Login Screen -->
    <div class="admin-login" id="loginScreen">
        <div class="login-container">
            <h1>Admin Panel</h1>
            <form id="loginForm">
                <input type="password" id="adminPassword" placeholder="Enter password" autocomplete="current-password">
                <button type="submit">Login</button>
                <p class="login-error" id="loginError"></p>
            </form>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div class="admin-dashboard" id="adminDashboard" style="display: none;">
        <nav class="admin-nav">
            <div class="admin-logo">Admin Panel</div>
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </nav>

        <div class="admin-content">
            <div class="admin-sidebar">
                <button class="sidebar-btn active" data-section="home">Home Page</button>
                <button class="sidebar-btn" data-section="cyber-luna">Cyber Luna</button>
                <button class="sidebar-btn" data-section="3d-consulting">3D Consulting</button>
                <button class="sidebar-btn" data-section="fablab">FabLab</button>
                <button class="sidebar-btn" data-section="settings">Settings</button>
            </div>

            <div class="admin-main">
                <!-- Home Page Editor -->
                <div class="editor-section active" id="section-home">
                    <h2>Home Page Content</h2>

                    <div class="form-group">
                        <label>Hero Title</label>
                        <input type="text" id="heroTitle" value="GIACOMO BERTAPELLE">
                    </div>

                    <div class="form-group">
                        <label>Hero Subtitle</label>
                        <input type="text" id="heroSubtitle" value="Creative Developer & Entrepreneur">
                    </div>

                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" id="heroLocation" value="Bologna, Italy">
                    </div>

                    <div class="form-group">
                        <label>About - Lead Paragraph</label>
                        <textarea id="aboutLead"
                            rows="3">Multi-venture entrepreneur bridging innovation across 3D printing, digital fabrication, and full-stack development.</textarea>
                    </div>

                    <div class="form-group">
                        <label>About - Body Text</label>
                        <textarea id="aboutBody"
                            rows="6">I build products at the intersection of technology and craftsmanship. My work spans e-commerce platforms, manufacturing automation, and digital tools—always focused on solving real problems with elegant technical solutions.</textarea>
                    </div>

                    <button class="save-btn" onclick="saveHomeContent()">Save Changes</button>
                </div>

                <!-- Cyber Luna Editor -->
                <div class="editor-section" id="section-cyber-luna">
                    <h2>Cyber Luna Project</h2>

                    <div class="form-group">
                        <label>Project Title</label>
                        <input type="text" id="cyberLunaTitle" value="Cyber Luna">
                    </div>

                    <div class="form-group">
                        <label>Category</label>
                        <input type="text" id="cyberLunaCategory" value="E-commerce · 3D Printing">
                    </div>

                    <div class="form-group">
                        <label>Short Description (Homepage)</label>
                        <textarea id="cyberLunaShortDesc"
                            rows="3">Premium 3D printing e-shop with custom design consultations and automated fulfillment. Built with Shopify integration and proprietary CAD optimization pipeline.</textarea>
                    </div>

                    <div class="form-group">
                        <label>Hero Subtitle (Project Page)</label>
                        <textarea id="cyberLunaHeroSubtitle"
                            rows="2">Premium 3D printing e-shop delivering custom cyberpunk aesthetics with automated fulfillment and proprietary CAD optimization.</textarea>
                    </div>

                    <div class="form-group">
                        <label>Stats - Orders</label>
                        <input type="text" id="cyberLunaOrders" value="340+">
                    </div>

                    <div class="form-group">
                        <label>Stats - Rating</label>
                        <input type="text" id="cyberLunaRating" value="4.8/5">
                    </div>

                    <div class="form-group">
                        <label>Stats - Repeat Rate</label>
                        <input type="text" id="cyberLunaRepeat" value="35%">
                    </div>

                    <button class="save-btn" onclick="saveCyberLunaContent()">Save Changes</button>
                </div>

                <!-- 3D Consulting Editor -->
                <div class="editor-section" id="section-3d-consulting">
                    <h2>3D Print Consulting & Automation</h2>

                    <div class="form-group">
                        <label>Project Title</label>
                        <input type="text" id="3dTitle" value="3D Print Consulting & Automation">
                    </div>

                    <div class="form-group">
                        <label>Category</label>
                        <input type="text" id="3dCategory" value="Manufacturing · Materials Engineering">
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="3dDesc"
                            rows="4">Advanced materials consulting and automated print farm framework systems. Custom integrations for multi-printer orchestration, material optimization (PLA, PETG, ASA, TPU), and production workflow automation.</textarea>
                    </div>

                    <button class="save-btn" onclick="save3DContent()">Save Changes</button>
                </div>

                <!-- FabLab Editor -->
                <div class="editor-section" id="section-fablab">
                    <h2>FabLab Projects</h2>

                    <div class="form-group">
                        <label>Project Title</label>
                        <input type="text" id="fablabTitle" value="FabLab Projects">
                    </div>

                    <div class="form-group">
                        <label>Category</label>
                        <input type="text" id="fablabCategory" value="Digital Fabrication">
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="fablabDesc"
                            rows="3">Advanced maker space initiatives focusing on Industry 4.0 technologies, robotics, and digital manufacturing processes.</textarea>
                    </div>

                    <button class="save-btn" onclick="saveFabLabContent()">Save Changes</button>
                </div>

                <!-- Settings -->
                <div class="editor-section" id="section-settings">
                    <h2>Settings</h2>

                    <div class="form-group">
                        <label>Change Admin Password</label>
                        <input type="password" id="newPassword" placeholder="New password">
                        <button class="save-btn" onclick="changePassword()">Update Password</button>
                    </div>

                    <div class="form-group">
                        <label>Export All Content (JSON)</label>
                        <button class="save-btn" onclick="exportContent()">Download Content</button>
                    </div>

                    <div class="form-group">
                        <label>Import Content (JSON)</label>
                        <input type="file" id="importFile" accept=".json">
                        <button class="save-btn" onclick="importContent()">Import Content</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>

</html>
